<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Модерация — Девятая планета</title><style>body{background:#08121e;color:#f1f5fa;font:16px system-ui;margin:0;padding:30px}main{max-width:760px;margin:auto}h1{font-size:26px}input,button{padding:12px;border-radius:9px;font:inherit}input{background:#152536;color:white;border:1px solid #4b6070}button{cursor:pointer;background:#286ba0;color:white;border:0;margin:4px}.item{background:#152536;padding:16px;border-radius:12px;margin:12px 0;overflow-wrap:anywhere}.muted{color:#acb9c6}a{color:#9ed3ff}</style></head><body><main><a href="../">← На сайт</a><h1>Модерация комментариев</h1><p class="muted">Доступ только для администратора сайта «Девятая планета».</p><div id="notice" role="status">Подключение базы данных пока не настроено.</div><div id="login" hidden><input id="email" type="email" placeholder="Почта администратора" autocomplete="username"><input id="password" type="password" placeholder="Пароль" autocomplete="current-password"><button id="signIn">Войти</button></div><div id="panel" hidden><button id="signOut">Выйти</button><h2>Ожидают проверки</h2><div id="items"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script>window.FILM_COMMENTS_CONFIG={url:"https://sivapdmzsxcbuyhuirbk.supabase.co",publishableKey:"sb_publishable_q8Aj2ZiD2x4W3l727koc4w_f5iAIGob"};</script><script> (async()=>{const cfg=window.FILM_COMMENTS_CONFIG||{},notice=document.getElementById('notice'),login=document.getElementById('login'),panel=document.getElementById('panel');if(!cfg.url||!cfg.publishableKey){notice.textContent='Ошибка конфигурации подключения.';return}if(!window.supabase){notice.textContent='Не удалось загрузить библиотеку Supabase. Проверьте блокировщик рекламы или доступ к CDN.';return}const db=window.supabase.createClient(cfg.url,cfg.publishableKey);notice.textContent='';login.hidden=false;async function load(){const {data:{user}}=await db.auth.getUser();login.hidden=!!user;panel.hidden=!user;if(!user)return;const {data:membership,error:me}=await db.from('comment_moderators').select('user_id').eq('user_id',user.id).maybeSingle();if(me||!membership){notice.textContent='У этой учётной записи нет прав модератора.';panel.hidden=true;return}const {data,error}=await db.from('film_comments').select('id,author_name,body,rating,created_at').eq('status','pending').order('created_at',{ascending:false}).limit(100);if(error){notice.textContent=error.message;return}const list=document.getElementById('items');list.replaceChildren();if(!data.length)list.textContent='Новых комментариев нет.';for(const c of data){const card=document.createElement('div');card.className='item';const name=document.createElement('strong');name.textContent=c.author_name+' · '+c.rating+'/5';const body=document.createElement('p');body.textContent=c.body;card.append(name,body);for(const [label,status] of [['Одобрить','approved'],['Отклонить','rejected']]){const btn=document.createElement('button');btn.textContent=label;btn.onclick=async()=>{btn.disabled=true;const {error}=await db.from('film_comments').update({status}).eq('id',c.id);if(error){notice.textContent=error.message;btn.disabled=false}else load()};card.append(btn)}list.append(card)}}document.getElementById('signIn').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});notice.textContent=error?error.message:'';if(!error)load()};document.getElementById('signOut').onclick=async()=>{await db.auth.signOut();load()};await load()})();</script></body></html>
